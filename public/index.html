<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#F3A65A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="寿司王" />
    <meta
      name="description"
      content="两个人在同一家寿司店，边吃边记，实时争夺寿司王。"
    />
    <link rel="manifest" href="/free_race/manifest.json" />
    <link rel="apple-touch-icon" href="/free_race/pwa-icon.png" />
    <title>寿司王</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff8e8;
        overscroll-behavior: none;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        min-height: 100%;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能开始寿司比赛。</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/free_race/sw.js', {
            scope: '/free_race/',
          });
        });
      }
    </script>
  </body>
</html>
